<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MD-Toggle Switch</title>
    <script src="functions.js"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        .tg-container {
            margin: 5px;
        }
        .md-tog::after {
            transition: transform 250ms;
        }
    </style>
</head>
<body>
    <table style="text-align:center;">
        <thead>
            <tr>
                <th>Toggle w/ Locking</th>
                <th>Toggle w/o Locking</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>
                    <div class="md-tg-container" title="Hold Ctrl to activate/deactivate the lock"><label for="test1">Toggle 1</label><input type="checkbox" class="md-tog" name="test1" id="test1" data-locked="false"></div>
                </td>
                <td>
                    <div class="md-tg-container"><label for="test2">Toggle 2</label><input type="checkbox" class="md-tog" name="test2" id="test2"></div>
                </td>
            </tr>
        </tbody>
    </table>
    <script>

        [...document.querySelectorAll('input[type="checkbox"]')].forEach(i => {
            i.addEventListener('click', md_toggle_functions.md_toggle_switch);
            i.previousElementSibling.addEventListener('click', md_toggle_functions.md_toggle_label);
        });

    </script>
</body>
</html>
