<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Templates</title>
    <style>
        ul {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 5px;
            margin: 10px auto;
            max-width: 1080px;
        }
        ul, li {
            border-radius: 1rem;
            padding: 10px;
            background-color: #aaa4f6;
        }
        li {
            flex: 1 1 auto;
            list-style: none;
            font-size: x-large;
            text-align: center;
            transition: background-color 750ms;
        }
        li:hover, li:has(> a:focus-visible){
            background-color: #7168f2b8;
            box-shadow: 0 0 4px 3px white;
        }
        li > a, li:hover > a:active, li:hover > a:hover, li:hover > a:focus, li:hover > a:visited {
            color: white;
        }
    </style>
</head>
