<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MD-Toggle Switch</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .tg-container {
            margin: 5px;
        }
        .md-tog::after {
            transition: transform 250ms;
        }
    </style>
</head>
<body>
    <table style="text-align:center;">
        <thead>
            <tr>
                <th>Toggle w/ Locking</th>
                <th>Toggle w/o Locking</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td></td>
                <td></td>
            </tr>
        </tbody>
    </table>
    <script type="module">
        import {mkToggle, nestElem, mkElem} from '../../scripts/crtElm-mod.js';
        const toggles = [
            mkToggle({id:'test1', name:'toggle1', class:'test-class', 'data-testing':'true', title:'Hold Ctrl while clicking to engage the lock', lockable: true, label:'Toggle 1', listeners:[{type:'change', execute:(ev)=>{console.log(ev.target.checked)}}]}),
            mkToggle({id:'test2', name:'toggle1', lockable: false, label:'Toggle 2', labelOpt:{listeners: [{type:'mouseenter', execute: function(){console.log(this.innerText)}}]}})
        ];
        [...document.querySelectorAll('td')].forEach((i, n)=>{
            i.append(toggles[n])
        })

    </script>
</body>
</html>
