<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MD-Toggle Switch</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .tg-container {
            margin: 5px;
        }
        .md-tog::after {
            transition: transform 250ms;
        }
    </style>
</head>
<body>
    <script type="module">
        import {mkToggle} from '../../scripts/crtElm-mod.js';
                
        const check1 = mkToggle({id:'test1', name:'toggle1', class:'test-class', 'data-testing':'true', lockable: true, label:'Testing 1', listeners:[{type:'change', execute:(ev)=>{console.log(ev.target.checked)}}]});
        const check2 = mkToggle({id:'test2', name:'toggle1', lockable: false, label:'Testing 2', labelOpt:{listeners: [{type:'mouseenter', execute: function(){console.log(this.innerText)}}]}});

        document.body.prepend(check1, check2)
    </script>
</body>
</html>
