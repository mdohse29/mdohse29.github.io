<!DOCTYPE html>
<html lang="en">
<head>
    <script>
        (async function () {
            const newUrl = "https://dohsedomain.com";

            try {
                const response = await fetch(newUrl, {
                    method: "HEAD",
                    mode: "cors",
                    cache: "no-store"
                });

                if (response.ok) {
                    window.location.replace(`${newUrl}/pages/momsPage/`);
                }
            } catch (err) {
                console.log("New site not reachable:", err);
            }
        })();
    </script>
    <meta charset="UTF-8">
