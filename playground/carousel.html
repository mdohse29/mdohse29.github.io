<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <script src="https://code.jquery.com/ui/1.13.3/jquery-ui.js"></script>
    <link rel="stylesheet" href="carousel.css">
</head>
<body>
    <div id="slideshow-wrapper" class="slideshow">
        <div class="slideshow-inner">
            <!-- div.ss-item > img -->
            <div class="ss-item active">
                <p>Slide 1</p>
            </div>
            <div class="ss-item">
                <p>Slide 2</p>
            </div>
            <div class="ss-item">
                <p>Slide 3</p>
            </div>
        </div>
        <div class="slideshow-controls">
            <button id="previous" class="slideshow-previous">
                <span class="previous-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Previous</span>
            </button>
            <button id="next" class="slideshow-next">
                <span class="next-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Next</span>
            </button>
        </div>
    </div>
    <script src="./carousel.js"></script>
</body>
</html>
